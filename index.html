<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pumpkin Earn Mini App</title>
    <!-- ប្រើប្រាស់ Font ស្អាតៗ និង Icon ពី FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #120a1f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background: linear-gradient(135deg, #1f1135 0%, #0d0617 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        /* Top Header */
        .header {
            padding: 15px;
            text-align: center;
            background: rgba(255, 115, 0, 0.1);
            border-bottom: 1px solid rgba(255, 115, 0, 0.3);
        }
        .header h2 {
            color: #ff9100;
            font-size: 18px;
        }
        .header p {
            font-size: 12px;
            color: #aaa;
        }
        /* Main Content */
        .content {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }
        .stash-card {
            background: linear-gradient(180deg, #42210b 0%, #241104 100%);
            border: 2px solid #ff9100;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(255, 145, 0, 0.2);
        }
        .stash-card h3 {
            font-size: 14px;
            color: #ffb74d;
            margin-bottom: 10px;
        }
        .stash-score {
            font-size: 40px;
            font-weight: 700;
            color: #ffcc00;
        }
        .stash-usd {
            font-size: 14px;
            color: #4caf50;
            margin-top: 5px;
        }
        /* Action Buttons (Earn & Withdraw) */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-earn {
            background-color: #ff9100;
            color: #120a1f;
        }
        .btn-withdraw {
            background-color: #2e7d32;
            color: #fff;
        }
        .btn:active {
            transform: scale(0.95);
        }
        /* Task List */
        .task-list {
            margin-top: 20px;
            background: #1a102b;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #332244;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a1b3d;
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-info h4 {
            font-size: 14px;
        }
        .task-info p {
            font-size: 11px;
            color: #aaa;
        }
        .task-btn {
            background: #ff9100;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }
        /* Bottom Navigation Bar */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #0d0617;
            border-top: 1px solid #2a1b3d;
            padding: 10px 0;
        }
        .nav-item {
            text-align: center;
            color: #888;
            text-decoration: none;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }
        .nav-item.active, .nav-item:hover {
            color: #ff9100;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ក្បាលកម្មវិធី -->
        <div class="header">
            <h2>Pumpkin Earn Bot</h2>
            <p>mini app</p>
        </div>

        <!-- មាតិកាកណ្តាល -->
        <div class="content">
            <!-- ប្រអប់បង្ហាញពិន្ទុ -->
            <div class="stash-card">
                <h3>YOUR PUMPKIN STASH</h3>
                <div class="stash-score" id="score">947</div>
                <div class="stash-usd" id="usd-value">≈ $0.013 · Pumpkin</div>
            </div>

            <!-- ប៊ូតុងបញ្ជា Earn / Withdraw -->
            <div class="action-buttons">
                <button class="btn btn-earn" onclick="earnPumpkin()"><i class="fa-solid fa-sack-dollar"></i> EARN</button>
                <button class="btn btn-withdraw"><i class="fa-solid fa-wallet"></i> WITHDRAW</button>
            </div>

            <!-- បញ្ជីកិច្ចការ -->
            <div class="task-list">
                <div class="task-item">
                    <div class="task-info">
                        <h4>Quick Tasks</h4>
                        <p>Fast pumpkin, one task at a time</p>
                    </div>
                    <button class="task-btn" onclick="earnPumpkin()">Start</button>
                </div>
                <div class="task-item">
                    <div class="task-info">
                        <h4>Lucky Wheel</h4>
                        <p>Spin for up to 100 pumpkin</p>
                    </div>
                    <button class="task-btn">Spin</button>
                </div>
            </div>
        </div>

        <!-- ម៉ឺនុយខាងក្រោម (Bottom Navigation) -->
        <div class="nav-bar">
            <a class="nav-item active"><i class="fa-solid fa-house"></i> HOME</a>
            <a class="nav-item"><i class="fa-solid fa-coins"></i> EARN</a>
            <a class="nav-item"><i class="fa-solid fa-gamepad"></i> PLAY</a>
            <a class="nav-item"><i class="fa-solid fa-user-group"></i> FRIENDS</a>
            <a class="nav-item"><i class="fa-solid fa-user"></i> ME</a>
        </div>
    </div>

    <script>
        // កូដ JavaScript សាមញ្ញសម្រាប់បន្ថែមពិន្ទុពេលចុចប៊ូតុង Earn
        let currentScore = 947;
        
        function earnPumpkin() {
            currentScore += 10; // បន្ថែម 10 ពិន្ទុរាល់ពេលចុច
            document.getElementById('score').innerText = currentScore;
            
            // គណនាតម្លៃ USD បន្ថែម (ឧទាហរណ៍: ១ពិន្ទុ = $0.0000137)
            let estimatedUsd = (currentScore * 0.0000137).toFixed(3);
            document.getElementById('usd-value').innerText = `≈ $${estimatedUsd} · Pumpkin`;
        }
    </script>
</body>
</html>
