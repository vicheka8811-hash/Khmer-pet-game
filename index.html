<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហ្គេមចិញ្ចឹមសត្វ និងដាំដុះខ្មែរ</title>
    <style>
        body {
            font-family: 'Khmer OS Siemreap', Arial, sans-serif;
            background-color: #eef2f3;
            text-align: center;
            padding: 15px;
            color: #333;
        }
        .game-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        .stats {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        /* จัดเรียงรายการในฟาร์มให้เป็นกริดสวยงาม */
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .farm-card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-family: 'Khmer OS Siemreap', Arial, sans-serif;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        .shop-section {
            margin-top: 20px;
            border-top: 1px dashed #ccc;
            padding-top: 15px;
            text-align: left;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff3e0;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .shop-item button {
            width: auto;
            margin: 0;
            padding: 5px 12px;
        }
        .pay-btn {
            background-color: #ff9800;
        }
        .pay-btn:hover {
            background-color: #e68900;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h2>🏡 កសិដ្ឋានបែបខ្មែរ</h2>
        
        <div class="stats">
            <p>💰 ប្រាក់/ពិន្ទុ: <span id="money">340</span> G</p>
            <p>🌱 សត្វ និងដើមឈើក្នុងកសិដ្ឋាន:</p>
            <!-- កន្លែងបង្ហាញជាកាតស្អាត -->
            <div class="farm-grid" id="inventory">
                <!-- ទិន្នន័យនឹងត្រូវទម្លាក់ចូលទីនេះដោយស្វ័យប្រវត្តិ -->
            </div>
        </div>

        <button onclick="workFarm()">🛠️ រកស៊ីចិញ្ចឹមជីវិត (+20 G)</button>

        <div class="shop-section">
            <h3>🛒 ហាងទិញសត្វ និងដើមឈើ</h3>
            
            <div class="shop-item">
                <span>🐄 គោ (100 G)</span>
                <button onclick="buyItem('🐄 គោ', 100)">ទិញ</button>
            </div>
            
            <div class="shop-item">
                <span>🍌 ដើមចេក (80 G)</span>
                <button onclick="buyItem('🍌 ដើមចេក', 80)">ទិញ</button>
            </div>

            <div class="shop-item">
                <span>🐖 ជ្រូក (120 G)</span>
                <button onclick="buyItem('🐖 ជ្រូក', 120)">ទិញ</button>
            </div>

            <div class="shop-item">
                <span>⭐ ដាក់លុយ (Telegram Stars)</span>
                <button class="pay-btn" onclick="buyWithRealMoney()">ដាក់លុយ</button>
            </div>
        </div>
    </div>

    <script>
        let money = 340;
        let ownedItems = ["🐖 ជ្រូក", "🥥 ដើមដូង", "ដើមដូង", "🐄 គោ"];

        function updateUI() {
            document.getElementById('money').innerText = money;
            
            let inventoryHTML = "";
            ownedItems.forEach(item => {
                inventoryHTML += `<div class="farm-card">${item}</div>`;
            });
            document.getElementById('inventory').innerHTML = inventoryHTML;
        }

        function workFarm() {
            money += 20;
            updateUI();
        }

        function buyItem(itemName, cost) {
            if (money >= cost) {
                money -= cost;
                ownedItems.push(itemName);
                updateUI();
                alert("ទិញ " + itemName + " បានដោយជោគជ័យ!");
            } else {
                alert("លុយ ឬពិន្ទុរបស់អ្នកមិនគ្រប់គ្រាន់ទេ!");
            }
        }

        function buyWithRealMoney() {
            alert("មុខងារទូទាត់ប្រាក់ពិត (Telegram Stars) នឹងត្រូវតភ្ជាប់ទីនេះ!");
            money += 200;
            updateUI();
        }

        updateUI();
    </script>

</body>
</html>
