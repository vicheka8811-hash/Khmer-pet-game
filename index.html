<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFree KH - មើលរឿងដោយសេរី គុណភាព HD</title>
    <link href="https://fonts.googleapis.com/css2?family=Preahvihear&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --primary-color: #e50914; /* Netflix Red style */
            --border-color: #dee2e6;
            --ad-bg: #e9ecef;
        }

        [data-theme="dark"] {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --text-color: #ffffff;
            --primary-color: #e50914;
            --border-color: #333333;
            --ad-bg: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Preahvihear', sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-theme {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Banner Ad Space (Telegram Ads / Monetag) */
        .ad-container {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto;
            background: var(--ad-bg);
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            text-align: center;
            padding: 15px;
            color: #888;
            font-size: 14px;
        }

        /* Hero Section / Featured Movie */
        .hero {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto;
            height: 350px;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') center/cover;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
            color: #fff;
        }

        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); }
        .hero p { font-size: 1rem; margin-bottom: 15px; max-width: 600px; text-shadow: 1px 1px 2px rgba(0,0,0,0.7); }
        
        .btn-watch {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 25px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            width: max-content;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Movie Grid Section */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .section-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-5px);
        }

        .movie-poster {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .movie-info {
            padding: 12px;
        }

        .movie-title {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #888;
        }

        /* Video Modal Player */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        .modal-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header>
        <div class="logo"><i class="fa-solid fa-play-circle"></i> CineFree KH</div>
        <div class="nav-actions">
            <button class="btn-theme" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
        </div>
    </header>

    <!-- Ad Banner Space (ទីតាំងសម្រាប់ដាក់កូដផ្សាយពាណិជ្ជកម្ម Telegram Ads / Monetag) -->
    <div class="ad-container">
        <!-- ឧទាហរណ៍៖ ដាក់កូដ Ad Script នៅទីនេះ -->
        <span>📢 [កន្លែងដាក់ពាណិជ្ជកម្ម / Telegram Ad Network / Banner Ads]</span>
    </div>

    <!-- Hero Featured Movie -->
    <div class="hero">
        <h1>រឿងភាគថ្មីៗ គុណភាពច្បាស់ HD</h1>
        <p>រីករាយទស្សនាភាពយន្តល្បីៗ សាច់រឿងអស្ចារ្យ ឥតគិតថ្លៃដោយគ្មានការរំខានច្រើន។</p>
        <button class="btn-watch" onclick="openPlayer('https://www.youtube.com/embed/dQw4w9WgXcQ', 'រឿងគំរូ ហាឡូ')"><i class="fa-solid fa-play"></i> មើលឥឡូវនេះ</button>
    </div>

    <!-- Movie List -->
    <div class="container">
        <div class="section-title"><i class="fa-solid fa-film"></i> ភាពយន្តពេញនិយម</div>
        <div class="movie-grid" id="movieGrid">
            <!-- ទិន្នន័យរឿងទាញយកតាម JS -->
        </div>
    </div>

    <!-- Video Player Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">ចំណងជើងរឿង</h3>
                <button class="close-btn" onclick="closePlayer()">&times;</button>
            </div>
            <div class="video-wrapper">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        // បញ្ជីរឿង (អ្នកអាចកែ ឬទាញយកពី Database/API របស់អ្នក)
        const movies = [
            { title: "សង្គ្រាមអวกាស (Sci-Fi Action)", year: "2026", rating: "8.5", poster: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=500&q=80", videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
            { title: "ស្នេហាក្នុងភ្លៀង (Romance)", year: "2025", rating: "7.9", poster: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=500&q=80", videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
            { title: "ដំណើរផ្សងព្រេង (Adventure)", year: "2026", rating: "9.0", poster: "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=500&q=80", videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
            { title: "អាថ៌កំបាំងព្រៃជ្រៅ (Thriller)", year: "2024", rating: "8.1", poster: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=500&q=80", videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ" }
        ];

        function renderMovies() {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.poster}" class="movie-poster">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">
                            <span>⭐ ${movie.rating}</span>
                            <span>${movie.year}</span>
                        </div>
                    </div>
                `;
                card.onclick = () => openPlayer(movie.videoUrl, movie.title);
                grid.appendChild(card);
            });
        }

        function openPlayer(url, title) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('videoPlayer').src = url;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if(html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                icon.className = 'fa-solid fa-sun';
            } else {
                html.setAttribute('data-theme', 'dark');
                icon.className = 'fa-solid fa-moon';
            }
        }

        renderMovies();
    </script>
</body>
</html>
